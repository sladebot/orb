name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write   # required for PyPI trusted publishing (OIDC)

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tooling
        run: pip install --upgrade build

      - name: Build wheel and sdist
        run: python -m build

      - name: List built artifacts
        run: ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Publishes to PyPI via trusted publishing (OIDC — no API token needed).
      # Requires a one-time setup on PyPI: project page → Publishing → Add a
      # new pending publisher → owner=sladebot, repo=orb, workflow=release.yml.
      # Until that's configured the step will fail loudly, but the GitHub
      # release above is already created so the failure is non-destructive.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
